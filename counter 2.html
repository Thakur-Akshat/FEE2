<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myntra Bag</title>
    <style>
        button:hover{
            scale:1.1;
        }
        .bag-button{
            background-color: lightgreen;
            border:none;
            padding:5px 15px;
            border-radius: 10px;
        }
        .wish-button{
            padding:5px 35px;
            border:2px solid black;
            border-radius:10px;
        }

    </style>
</head>
<body>
    <button class="bag-button" onclick ="++bagQty;updateCart();">Add to Bag</button>
    <button class="wish-button" onclick="--bagQty;updateCart();">Move to Wishlist </button>
    <button class="bag-button" onclick="bagQty+=2;updateCart();">Add 1+1 Sale item</button>

    <h2 id="cart-summary"></h2>
    

    <script>
        let bagQty=0;
        updateCart(); //for initial displaying of cart info ie 0 items  
        function updateCart(){
            document.querySelector('#cart-summary').innerText=`Your Bag has ${bagQty} items`; //now the h2 will be  refreshed everytime the button will be clicked and the updated value 
                                                                                                //of the variable will be displayed
        }
        
    </script>
</body>
</html>
