<!DOCTYPE html>
<html lang="en">
<head>
    <title>Cricket game</title>
    <style>
        body{
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Bat-Ball-stump Game</h1>

    <button onclick="
    //Making computer choice
    let computerChoice= genCompChoice();
    //Finding out the result
    let resultMsg=getResult('Bat',computerChoice);
    //Announcing the result
    showResult('Bat',computerChoice,resultMsg);  
    ">Bat</button>


    <button class="ball" onclick="
    //computerChoice;
    computerChoice=genCompChoice(); 
    //Finding out result
    resultMsg=getResult('Ball',computerChoice);
    //REsult announcement
    showResult('Ball',computerChoice,resultMsg)
    ">Ball</button>


    <button class="stump" onclick="
    //computerChoice;
    computerChoice= genCompChoice();
    //Finding winner
    resultMsg=getResult('Stump',computerChoice);
    //Result announcement
    showResult('Stump',computerChoice,resultMsg);
    ">Stump</button>
    
    <!-- /*Localstorage se score toh htana hi hai pr memory mei jo score object hai usko bhi reset krna mt bhulna*/ -->
    <button class="reset" onclick="localStorage.clear()
    score={win:0,
            lost:0,
            tie:0
            };">Reset</button>

            <!-- ################# AB AYEGA ERROR  HMNE RESET TOH KRDIYA SCORE ONRESET BUT AB JO displayScore Funnction hai vo bhi gayab ho jayega
                    Toh ab yaa toh usse bhi  reset mei dallo ya ---- see 5.2###################### -->

    <script>
        let scoreStr=localStorage.getItem('Score');
        let score=JSON.parse(scoreStr) || {      //agr pehli wali undefined aati hai toh ye daal do --> vo undefined tb ayegi jb local storage mei koi score nhi milega
                win:0,
                lost:0,
                tie:0
            };
        

        score.displayScore= function(){
                return `Won:${score.win}, Lost:${score.lost}, Tie:${score.tie}`;
            }
        
        function genCompChoice(){ 
            let randomNo=Math.random()*3;
            if(randomNo>0 && randomNo<1)     return 'Bat';
            else if(randomNo>=1&&randomNo<2) return 'Ball';
            else return 'Stump';
        }
        function getResult(userMove,computerMove){
            if(userMove==computerMove){
                score.tie++;
                return 'Its a tie';
            } 

            else if(computerMove==='Bat') {
                if(userMove==='Ball'){
                    score.lost++;
                    return 'Computer has won';
                } 
                else{
                    score.win++;
                    return 'User has won'; 
                }  
            }
            else if(computerMove==='Ball'){
                if(userMove==='Bat') {
                    score.win++;
                    return 'User has won';
                }
                else {
                    score.lost++;
                    return 'Computer has won';
                }

            }
            else if(computerMove==='Stump'){
                if(userMove==='Ball'){
                    score.win++;
                    return 'User has won';
                } 
                else{
                    score.lost++;
                    return 'Computer has won';
                } 
            }
        }

        function showResult(userMove,computerMove,resultMsg){

            alert(`You have chosen ${userMove}. Computer choice is ${computerMove} and ${resultMsg}
            ${score.displayScore()}`);
            //Storing score in local storage
            localStorage.setItem('Score',JSON.stringify(score));

    
        }


    </script>
    
</body>
</html>
