<!-- //Improving the code cleaning it 
//making functions for  computer choice;
//result analysis
//and showing result -->
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Cricket game</title>
    <style>
        body{
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Bat-Ball-stump Game</h1>

    <button onclick="
    //Making computer choice
    let computerChoice= genCompChoice();
    //Finding out the result
    let resultMsg=getResult('Bat',computerChoice);
    //Announcing the result
    showResult('Bat',computerChoice,resultMsg);  
    ">Bat</button>


    <button class="ball" onclick="
    //computerChoice;
    computerChoice=genCompChoice(); 
    //Finding out result
    resultMsg=getResult('Ball',computerChoice);
    //REsult announcement
    showResult('Ball',computerChoice,resultMsg)
    ">Ball</button>


    <button class="stump" onclick="
    //computerChoice;
    computerChoice= genCompChoice();
    //Finding winner
    resultMsg=getResult('Stump',computerChoice);
    //Result announcement
    showResult('Stump',computerChoice,resultMsg);
    ">Stump</button>

    <script>
        
        function genCompChoice(){ 
            let randomNo=Math.random()*3;
            if(randomNo>0 && randomNo<1)     return 'Bat';
            else if(randomNo>=1&&randomNo<2) return 'Ball';
            else return 'Stump';
        }
        function getResult(userMove,computerMove){
            if(userMove==computerMove) return 'Its a tie';

            else if(computerMove==='Bat') {
                if(userMove==='Ball') return 'Computer has won';
                else return 'User has won';   
            }
            else if(computerMove==='Ball'){
                if(userMove==='Bat') return 'User has won';
                else return 'Computer has won';

            }
            else if(computerMove==='Stump'){
                if(userMove==='Ball') return 'User has won';
                else return 'Computer has won';
            }
        }

        function showResult(userMove,computerMove,resultMsg){
            alert(`You have chosen ${userMove}. Computer choice is ${computerMove} and ${resultMsg}`);
    
        }


    </script>
    
</body>
</html>
